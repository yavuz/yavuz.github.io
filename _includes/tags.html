{% if post.tags %}
<h4>etiketler</h4>
	{% for tag in post.tags %}
    	<span class="label label-default"><a href="{{ site.baseurl }}/tags/#{{ tag }}-ref" title="{{ tag }} etiketli yazılar">{{ tag }}</a></span>
    {% endfor %}
{% endif %}
{% if page.tags %}
<h4>etiketler</h4>
	{% for tag in page.tags %}
    	<span class="label label-default"><a href="{{ site.baseurl }}/tags/#{{ tag }}-ref" title="{{ tag }} etiketli yazılar">{{ tag }}</a></span>
    {% endfor %}
{% endif %}
