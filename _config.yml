# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Yavuz Yıldırım
tagline: Yazılım, makine öğrenmesi ve LLM notları
#email: yavuz@yapps.co
description: "Yavuz Yıldırım'ın Türkçe teknik notları: Python, Laravel, Django, Redis, Elasticsearch, makine öğrenmesi ve büyük dil modelleri."
#baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://yavuz.github.io" # the base hostname & protocol for your site, e.g. http://example.com
lang: tr
locale: tr_TR
author:
  name: Yavuz Yıldırım
  url: https://yavuz.github.io/hakkimda/
  twitter: yavuzyildirim
twitter:
  username: yavuzyildirim
  card: summary_large_image
social:
  name: Yavuz Yıldırım
  links:
    - https://yavuzyildirim.com/
    - https://github.com/yavuz
    - https://x.com/yavuzyildirim
    - https://yavuzyildirim.substack.com/
    - https://listln.com/user/yavuz
seo_paginator_message: "Sayfa %<current>s / %<total>s: "
twitter_username: yavuzyildirim
github_username: yavuz
listln_username: yavuz
substack_username: yavuzyildirim

# Build settings
markdown: kramdown
theme: minima
plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-paginate
    - jekyll-sitemap

highlighter: rouge
# paginate_path: "/page:num"

google_analytics: UA-44045877-3
images: '/assets/img'
permalink: /:title/
paginate: 10
paginate_path: "/page:num/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      lang: tr
  - scope:
      path: ""
      type: pages
    values:
      lang: tr
github: https://github.com/yavuz
show_excerpts: true # set to true to show excerpts on the homepage
disqus:
    shortname: yavuz-github-io

# exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
    - README.md
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
